[project]
name = "chess-engine"
version = "0.1.0"
description = "A chess engine in Python, later ported to C++"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.10"]   # phase 11

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-benchmark>=4",
  "hypothesis>=6",
  "mypy>=1.11",
  "ruff>=0.6",
  "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PL", "RUF", "PT", "N"]
ignore = ["PLR2004"]          # magic numbers are everywhere in chess code

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913", "S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not slow'"
markers = ["slow: deep perft / long-running tests (run nightly)"]

[tool.coverage.run]
source = ["chess_engine"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
